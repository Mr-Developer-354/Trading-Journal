<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · The Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f5f6f8; --card:#ffffff; --text:#1d2330; --muted:#6b7385; --line:#e3e6ec; --accent:#4f7cff; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg:#0f1218; --card:#1a1f29; --text:#e6e9ef; --muted:#8b93a7; --line:#2a3140; --accent:#6d93ff; }
    }
    :root[data-theme="dark"] { --bg:#0f1218; --card:#1a1f29; --text:#e6e9ef; --muted:#8b93a7; --line:#2a3140; --accent:#6d93ff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
      background:var(--bg); color:var(--text); font:15px/1.5 Inter, system-ui, sans-serif; }
    .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line);
      border-radius:16px; padding:32px 28px; box-shadow:0 10px 30px rgba(0,0,0,.12); text-align:center; }
    .logo { font-size:34px; line-height:1; margin-bottom:10px; }
    h1 { font-size:22px; margin:0 0 6px; font-weight:700; }
    p.sub { margin:0 0 24px; color:var(--muted); }
    button.google { width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
      padding:12px 16px; border:1px solid var(--line); border-radius:10px; background:var(--card);
      color:var(--text); font:600 15px Inter, system-ui, sans-serif; cursor:pointer; }
    button.google:hover { border-color:var(--accent); }
    button.google:disabled { opacity:.6; cursor:wait; }
    .g { width:18px; height:18px; }
    #msg { margin-top:16px; color:#d64545; font-size:14px; }
    #msg[hidden] { display:none; }
    .foot { margin-top:22px; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">📒</div>
    <h1>The Book</h1>
    <p class="sub">Sign in to open your trading journal. Your data syncs to your account.</p>

    <button class="google" id="google" type="button" disabled>
      <svg class="g" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.95 4 4 12.95 4 24s8.95 20 20 20 20-8.95 20-20c0-1.3-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
      </svg>
      Sign in with Google
    </button>

    <div id="msg" role="alert" hidden></div>
    <div class="foot">Microsoft sign-in coming soon.</div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script>
    (function () {
      const btn = document.getElementById('google');
      const msg = document.getElementById('msg');
      const show = t => { msg.textContent = t || ''; msg.hidden = !t; };

      if (typeof firebase === 'undefined') {
        show('Could not load sign-in. Check your internet connection and reload the page.');
        return;
      }
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      const auth = firebase.auth();

      // Already signed in: go straight to the journal.
      auth.onAuthStateChanged(user => {
        if (user) location.replace('index.html');
        else btn.disabled = false;
      });

      btn.addEventListener('click', async () => {
        btn.disabled = true;
        show('');
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
          await auth.signInWithPopup(provider);   // onAuthStateChanged then opens the journal
        } catch (e) {
          if (e.code === 'auth/popup-blocked') { await auth.signInWithRedirect(provider); return; }
          btn.disabled = false;
          if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
          show(e.code === 'auth/operation-not-allowed'
            ? 'Google sign-in is not turned on in Firebase yet.'
            : 'Sign-in failed: ' + (e.message || e.code));
        }
      });
    })();
  </script>
</body>
</html>
