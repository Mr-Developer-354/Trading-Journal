# Fetches the NSE trading holiday list every week (and on demand) and commits data/nse-holidays.json when it changes.
name: NSE holidays
on:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch NSE holidays
        run: node scripts/fetch-nse-holidays.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/nse-holidays.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nse-holidays.json
          git commit -m "Update NSE holiday list"
          git push
